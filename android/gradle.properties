# Project-level Gradle properties.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true

# Brought to the SunApp baseline 2026-09-04. android.nonFinalResIds=false was removed:
# it is incompatible with resource shrinking under AGP 9.3.1 and R8 refuses the build.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.nonTransitiveRClass=true
# Keep the VCS stamp out of the APK: it varies per checkout and breaks byte reproduction.
android.vcsInfo.enabled=false
