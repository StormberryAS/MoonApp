# GitHub Pages serves moon.stormberry.as from this repository root.
#
# Everything listed below is source, tooling or build input that must never be
# published. Without this file Pages would serve the whole Android tree,
# including gradlew, the Gradle wrapper jar and local.properties.
#
# Added 2026-09-04, before android/ was committed, for the same reason SunApp's
# was added on 2026-08-21: so that scaffolding the Android module cannot leak.
#
# disclaimer.html is deliberately NOT excluded: it is the published disclaimer the
# site links to. Only the Markdown source of it is withheld.
exclude:
  - android/
  - .venv/
  - venv/
  - README.md
  - LICENSE
  - zapstore.yaml
  - fastlane/
  - NOTICE
  - DISCLAIMER.md
  - bump_assets.py
  - tools/
# bump_assets.py and tools/ added 2026-09-05: the estate-wide sweep found both still
# reachable from the live site (tools/build-store-icon.py returned 200).
# Type-checking tooling, added 2026-10-16, then the TypeScript move (22 October 2026, on SunApp's
# model of 21 October): the TypeScript sources (ts/), the tests (tests/), the package files, .npmrc,
# tsconfig.json and the installed compiler (node_modules/, never committed) are excluded. tools/
# (which now also holds build-ts.sh and the three corpus generators) was excluded already. The page
# loads only the compiled app.js, which IS published. jsconfig.json and types/ are gone: the
# declarations moved into ts/.
  - node_modules/
  - package.json
  - package-lock.json
  - .npmrc
  - tsconfig.json
  - ts/
  - tests/
